<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문의하기</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f4f8;
      color: #143D60;
      line-height: 1.6;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .navbar .logo {
      font-weight: bold;
      font-size: 1.4rem;
      color: #111827;
      cursor: pointer;
    }

    .navbar .nav-menu {
      display: flex;
      gap: 28px;
      margin-right: 75px;
    }

    .navbar .nav-menu a {
      text-decoration: none;
      color: #374151;
      font-size: 1rem;
    }

    .navbar .lang {
      font-size: 1rem;
      color: #6b7280;
      cursor: pointer;
    }

    h1, h2 {
      text-align: center;
    }

    .contact-section {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .contact-section h2 {
      color: #143D60;
      margin-bottom: 15px;
      border-bottom: 2px solid #111827;
      padding-bottom: 5px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .contact-form label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .contact-form .input-row {
      display: flex;
      gap: 50px;
    }

    .contact-form input, .contact-form textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.9rem;
      width: 100%;
    }

    .contact-form input {
      flex: 1;
    }

    .contact-form textarea {
      resize: vertical; 
      height: 150px;
    }

    .contact-form button {
      padding: 10px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    .contact-form button:hover {
      background-color: #2563eb;
    }

    footer {
      text-align: center;
      font-size: 0.9em;
      color: #777;
      margin: 40px 0 20px;
    }

    .email-input-group {
      display: flex;
      align-items: center;
      width: calc(100% - 12px);
    }

    .email-input-group input[type="text"] {
      width: calc(50% - 10px);
      margin-right: 10px;
    }

    .email-input-group span {
      margin: 0 5px;
    }

    .email-input-group select {
      width: calc(50% - 10px);
      margin-left: 10px;
      height: 38px;
    }

    .email-input-group input[type="email"] {
      width: calc(50% - 10px);
      margin-left: 10px;
    }

    .email-input-group select#email_domain_select {
      display: block;
    }

    .email-input-group input#email_custom_domain {
      display: none;
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .navbar .nav-menu {
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 10px;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Chain LAB</div>
    <div class="nav-menu">
      <a href="introduce.html">소개</a>
      <a href="data.html">자료</a>
      <a href="develop.html">개발</a>
      <a href="faq.html">Q&A</a>
    </div>
    <div class="lang">언어</div>
  </nav>

  <h1>문의하기</h1>

  <div class="contact-section">
    <h2>문의</h2>
    <form class="contact-form">
      <div class="input-row">
        <div>
          <label for="name">아이디:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">문의 받을 이메일:</label>
          <div class="email-input-group">
            <input type="text" id="email_prefix" name="email_prefix" placeholder="이메일 주소" required>
            <span>@</span>
            <select id="email_domain_select" name="email_domain">
              <option value="">선택하세요</option>
              <option value="naver.com">naver.com</option>
              <option value="gmail.com">gmail.com</option>
              <option value="daum.net">daum.net</option>
              <option value="직접 입력">직접 입력</option>
            </select>
            <input type="email" id="email_custom_domain" name="email_custom_domain" placeholder="직접 입력" style="display: none;">
          </div>
        </div>
      </div>

      <label for="message">내용:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">전송</button>
    </form>
  </div>

  <footer>
  </footer>

  <script>
    document.querySelector('.logo').addEventListener('click', function () {
      window.location.href = 'home.html';
    });

    const emailDomainSelect = document.getElementById('email_domain_select');
    const emailCustomDomainInput = document.getElementById('email_custom_domain');

    emailDomainSelect.addEventListener('change', function() {
      if (this.value === '직접 입력') {
        emailDomainSelect.style.display = 'none';
        emailCustomDomainInput.style.display = 'inline-block';
        emailCustomDomainInput.focus();
      } else {
        emailDomainSelect.style.display = 'inline-block';
        emailCustomDomainInput.style.display = 'none';
      }
    });
  </script>

</body>
</html>
