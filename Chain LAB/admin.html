<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 승인 페이지 | Chain LAB</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <style>
    body { font-family:'Segoe UI',sans-serif;background:#f9fafb;color:#111827;margin:0;padding:20px; }
    h1 { text-align:center; }
    table { width:100%;border-collapse:collapse;margin-top:20px;background:white; }
    th, td { border:1px solid #e5e7eb;padding:10px;text-align:center; }
    th { background-color:#f3f4f6; }
    button { padding:8px 14px;border:none;border-radius:5px;color:white;font-weight:bold;cursor:pointer; }
    .approve { background-color:#16a34a; }
    .reject { background-color:#dc2626; }
    .refresh { background-color:#3b82f6;margin-top:10px;display:block;margin:auto; }
    #connectBtn { background:#3b82f6;margin-bottom:10px; }
    #wallet { margin-top:10px;font-weight:bold;text-align:center; }
  </style>
</head>
<body>

  <h1>관리자 승인 페이지</h1>
  <div style="text-align:center;">
    <button id="connectBtn">🦊 MetaMask 연결</button>
    <p id="wallet">지갑: 연결 안 됨</p>
  </div>

  <button class="refresh" onclick="loadFiles()">🔄 새로고침</button>

  <table id="fileTable">
    <thead>
      <tr>
        <th>파일명</th>
        <th>업로드 주소</th>
        <th>상태</th>
        <th>액션</th>
      </tr>
    </thead>
    <tbody id="fileList"></tbody>
  </table>

  <script>
    // ✅ MetaMask + TimeCoin 설정
    let web3, account, timeCoin;
    const contractAddress = "0x66D7cB7a8C12da18CBE370511E4d353d9042Dd26";
    const contractABI = [
      {
        "inputs": [
          { "internalType": "address", "name": "to", "type": "address" },
          { "internalType": "uint256", "name": "amount", "type": "uint256" }
        ],
        "name": "mint",
        "outputs": [],
        "stateMutability": "nonpayable",
        "type": "function"
      },
      {
        "inputs": [
          { "internalType": "address", "name": "to", "type": "address" },
          { "internalType": "uint256", "name": "amount", "type": "uint256" }
        ],
        "name": "transfer",
        "outputs": [],
        "stateMutability": "nonpayable",
        "type": "function"
      },
      {
        "inputs": [
          { "internalType": "address", "name": "", "type": "address" }
        ],
        "name": "balanceOf",
        "outputs": [
          { "internalType": "uint256", "name": "", "type": "uint256" }
        ],
        "stateMutability": "view",
        "type": "function"
      }
    ];

    // ✅ MetaMask 연결
    async function connectMetaMask() {
      if (!window.ethereum) return alert("⚠️ MetaMask가 설치되어 있지 않습니다!");

      try {
        web3 = new Web3(window.ethereum);
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        account = accounts[0];
        document.getElementById("wallet").innerText = "지갑: " + account;

        timeCoin = new web3.eth.Contract(contractABI, contractAddress);
        console.log("🦊 MetaMask 연결됨:", account);
        alert("✅ MetaMask 연결 성공!");
      } catch (err) {
        console.error("MetaMask 연결 실패:", err);
        alert("❌ MetaMask 연결 실패!");
      }
    }

    // ✅ 서버에서 업로드 파일 목록 불러오기
    async function loadFiles() {
      const res = await fetch("http://localhost:3000/files");
      const data = await res.json();
      const tbody = document.getElementById("fileList");
      tbody.innerHTML = "";

      data.forEach(file => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><a href="http://localhost:3000/uploads/${file.filename}" target="_blank">${file.filename}</a></td>
          <td>${file.address}</td>
          <td>${file.approved ? "✅ 승인됨" : "⏳ 대기중"}</td>
          <td>
            ${file.approved ? "-" : `
              <button class="approve" onclick="approveAndMint('${file.filename}', '${file.address}')">승인 & 지급</button>
              <button class="reject" onclick="rejectFile('${file.filename}')">거절</button>
            `}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ✅ 승인 & 코인 지급
    async function approveAndMint(filename, address) {
      if (!account) return alert("⚠️ 먼저 MetaMask를 연결하세요!");
      const amount = prompt("💰 지급할 코인 수를 입력하세요 (예: 10):");
      if (!amount || isNaN(amount) || amount <= 0) return alert("❌ 잘못된 입력입니다.");

      try {
        // 1️⃣ 서버 승인
        await fetch("http://localhost:3000/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename })
        });

        // 2️⃣ 코인 지급 (mint)
        const amountWei = web3.utils.toWei(amount.toString(), "ether");
        await timeCoin.methods.mint(address, amountWei).send({
          from: account,
          gas: 3000000
        });

        alert(`🎉 ${amount} TMC 지급 완료!`);
        loadFiles();
      } catch (err) {
        console.error("코인 지급 실패:", err);
        alert("❌ 트랜잭션 실패 (가스 또는 권한 확인)");
      }
    }

    // ✅ 거절 처리
    async function rejectFile(filename) {
      const res = await fetch("http://localhost:3000/reject", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename })
      });
      const result = await res.json();
      if (result.success) {
        alert("❌ 거절 완료");
        loadFiles();
      } else {
        alert("⚠️ 처리 실패");
      }
    }

    // ✅ 버튼 이벤트
    document.getElementById("connectBtn").addEventListener("click", connectMetaMask);
    window.addEventListener("load", loadFiles);
  </script>
</body>
</html>
